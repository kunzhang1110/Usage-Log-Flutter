name: usage_log_flutter
description: "An Usage Log for Android built with Flutter."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usage_stats: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher/ic_full.png"
  adaptive_icon_background: "assets/launcher/ic_bg.png"
  adaptive_icon_foreground: "assets/launcher/ic_fg.png"

flutter:
  uses-material-design: true